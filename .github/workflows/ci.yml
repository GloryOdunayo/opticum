name: CI

on:
  push:
    branches: ["main", "chore/*", "feat/*", "fix/*", "docs/*"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles(format('apps/{0}/package-lock.json', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --force

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck
